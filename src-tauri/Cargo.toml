[package]
name = "file-list-studio"
version = "0.1.0"
description = "A native desktop application for creating lists of local files and folders."
authors = ["Manus AI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
walkdir = "2"
chrono = { version = "0.4", features = ["clock"] }
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
